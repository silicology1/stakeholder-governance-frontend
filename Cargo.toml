[package]
name = "stakeholder-governance-frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7", features = ["web", "router"] }
starknet-rust = "0.20"
starknet-types-core = { version = "0.2.4", features = ["hash"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
url = "2"
